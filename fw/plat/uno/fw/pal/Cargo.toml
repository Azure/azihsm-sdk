[package]
edition = "2024"
name = "azihsm_fw_uno_pal"
version = "0.1.0"

[lib]
bench = false
doctest = false
test = false

[dependencies]
azihsm_fw_core_crypto_key_derive = { workspace = true }
azihsm_fw_core_crypto_key_masking = { optional = true, workspace = true }
azihsm_fw_core_crypto_x509_builder = { workspace = true }
azihsm_fw_ddi_mbor = { optional = true, workspace = true }
azihsm_fw_ddi_mbor_derive = { optional = true, workspace = true }
azihsm_fw_ddi_mbor_types = { optional = true, workspace = true }
azihsm_fw_hsm_pal_traits = { workspace = true }
azihsm_fw_single_cell = { workspace = true }
azihsm_fw_static_init = { workspace = true }
azihsm_fw_static_ref = { workspace = true }
azihsm_fw_uno_cert_blob = { workspace = true }
azihsm_fw_uno_drivers_aes = { workspace = true }
azihsm_fw_uno_drivers_bks_store = { workspace = true }
azihsm_fw_uno_drivers_boot_status = { workspace = true }
azihsm_fw_uno_drivers_core_status = { workspace = true }
azihsm_fw_uno_drivers_gdma = { workspace = true }
azihsm_fw_uno_drivers_iic = { workspace = true }
azihsm_fw_uno_drivers_ipc = { workspace = true }
azihsm_fw_uno_drivers_nvic = { workspace = true }
azihsm_fw_uno_drivers_oic = { workspace = true }
azihsm_fw_uno_drivers_part_store = { workspace = true }
azihsm_fw_uno_drivers_rng = { workspace = true }
azihsm_fw_uno_drivers_semihosting = { optional = true, workspace = true }
azihsm_fw_uno_drivers_session_store = { workspace = true }
azihsm_fw_uno_drivers_sha = { workspace = true }
azihsm_fw_uno_drivers_systick = { workspace = true }
azihsm_fw_uno_drivers_upka = { workspace = true }
azihsm_fw_uno_drivers_vault = { workspace = true }
azihsm_fw_uno_error = { workspace = true }
azihsm_fw_uno_key_vault = { workspace = true }
azihsm_fw_uno_pac = { workspace = true }
azihsm_fw_uno_reg_soc = { workspace = true }
azihsm_fw_uno_trace = { workspace = true }

embassy-futures = { workspace = true }
embassy-time = { workspace = true }
tock-registers = { workspace = true }

bitfield-struct = { workspace = true }
der = { workspace = true }
open-enum = { workspace = true }
zerocopy = { workspace = true }
zeroize = { workspace = true }

[features]
default = []
# Optional host-poll path: also signal SYS_READY via ARM semihosting in
# addition to the silicon boot_handshake::set_boot_status(Run). Hosts
# that cannot snoop semihosting (e.g. production) should disable this
# feature — boot_handshake alone is sufficient.
semihosting = ["dep:azihsm_fw_uno_drivers_semihosting"]

# Test-only DDI commands, routed through the `HsmCustomDispatch` PAL hook
# rather than the core opcode tables. Adds `TestAction` (DdiOp 2004),
# which crash-recovery testing uses to inject faults. Never enable in a
# production build.
mcr_test_action = ["dep:azihsm_fw_ddi_mbor", "dep:azihsm_fw_ddi_mbor_derive"]

# FIPS-validation-only DDI commands, routed through the
# `HsmCustomDispatch` PAL hook rather than the core opcode tables. Adds
# `GetPrivKey` (DdiOp 2005) and `RawKeyImport` (DdiOp 2008), which a host
# Known-Answer-Test suite uses to import raw key vectors and read them
# back. The opcodes live in no core table and no core crate knows them;
# the request/response envelope is redeclared below the PAL. Importing a
# key produces a masked re-import blob, so this pulls in the shared
# key-masking crate (and the `DdiMaskedKeyMetadata` wire type it
# requires). Never enable in a production build.
fips_validation_hooks = [
  "dep:azihsm_fw_core_crypto_key_masking",
  "dep:azihsm_fw_ddi_mbor",
  "dep:azihsm_fw_ddi_mbor_derive",
  "dep:azihsm_fw_ddi_mbor_types",
]

# General MCR test hooks, reserved for below-PAL test commands that do
# not need the MBOR codec. Currently a placeholder. Never enable in a
# production build.
mcr_test_hooks = []
