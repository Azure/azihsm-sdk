[package]
edition = "2021"
name = "azihsm_fw_hsm_core"
version = "0.1.0"

[lib]
bench = false
doctest = false
test = false

[dependencies]
azihsm_fw_core_crypto_aead_envelope.workspace = true
azihsm_fw_core_crypto_hpke.workspace = true
azihsm_fw_core_crypto_key_derive.workspace = true
azihsm_fw_core_crypto_key_masking.workspace = true
azihsm_fw_core_crypto_key_report.workspace = true
azihsm_fw_core_crypto_ml_dsa = { optional = true, workspace = true }
azihsm_fw_core_crypto_x509_builder.workspace = true
azihsm_fw_core_crypto_x509_chain.workspace = true
azihsm_fw_core_evidence.workspace = true
azihsm_fw_ddi_mbor = { features = ["trusted-encode"], workspace = true }
azihsm_fw_ddi_mbor_api.workspace = true
azihsm_fw_ddi_mbor_types.workspace = true
azihsm_fw_ddi_tbor.workspace = true
azihsm_fw_ddi_tbor_types.workspace = true
azihsm_fw_hsm_core_tracing.workspace = true
azihsm_fw_hsm_io.workspace = true
azihsm_fw_hsm_key_decode.workspace = true
azihsm_fw_hsm_key_unwrap.workspace = true
azihsm_fw_hsm_oob.workspace = true
azihsm_fw_hsm_pal_traits.workspace = true
azihsm_fw_hsm_undo.workspace = true

zerocopy.workspace = true

[features]
default = ["mbor", "std", "tbor-unwrap-key"]
std = []

# The MBOR wire codec and its command handlers. Enabled by default; a
# build that only needs TBOR can turn this off to reclaim the MBOR
# dispatch tree (~90 KiB of .text). `OP_MBOR` then reports an
# unsupported opcode.
mbor = []

# The TBOR UnwrapKey command. Enabled by default; a diagnostic build that
# does not import wrapped keys can turn it off to reclaim ~13.8 KiB of
# .text. The opcode then reports an unsupported command.
tbor-unwrap-key = []

# The TBOR MlDsaSign / MlDsaVerify commands (FIPS 204 post-quantum
# signatures). Off by default: the ML-DSA implementation costs ~73 KiB of
# .text, which does not fit alongside the MBOR dispatch tree, so a build
# enabling it must disable `mbor`. The opcodes report an unsupported
# command when it is off.
tbor-ml-dsa = ["dep:azihsm_fw_core_crypto_ml_dsa"]

# Select ML-DSA-44 for the TBOR PQC commands. A build links exactly one
# parameter set (carrying both would roughly double the ~73 KiB cost), and
# ML-DSA-44 is the only set whose *signing* path fits this part's stack:
# signing measures 108 KiB of frame at ML-DSA-44 against 322 KiB at
# ML-DSA-65, versus a 163.4 KiB stack region. The emulator selects the same
# set so one test binary covers both emu and silicon.
tbor-ml-dsa-44 = [
  "azihsm_fw_core_crypto_ml_dsa?/param-mldsa44",
  "tbor-ml-dsa",
  "tbor-ml-dsa-keygen",
]

# Select ML-DSA-87. The signing path does not fit this part at all -- it is
# performed by FP1 through `HsmMlDsa` -- so unlike `tbor-ml-dsa-44` this set
# is only usable on a platform whose PAL offloads the work.
tbor-ml-dsa-87 = [
  "azihsm_fw_core_crypto_ml_dsa?/param-mldsa87",
  "tbor-ml-dsa",
  "tbor-ml-dsa-keygen",
]

# On-device ML-DSA key generation. Fits at every parameter set now that key
# generation returns the encoded verifying key it already computed.
tbor-ml-dsa-keygen = ["tbor-ml-dsa"]
tracing = []
