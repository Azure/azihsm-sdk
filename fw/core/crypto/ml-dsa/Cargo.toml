[package]
edition = "2021"
name = "azihsm_fw_core_crypto_ml_dsa"
version = "0.1.0"

[lib]
bench = false
doctest = false
test = true

[features]
default = []

# Run the self-test at ML-DSA-44 instead of ML-DSA-65. Diagnostic only: the
# smaller key and matrix separate a stack-capacity failure from an
# algorithmic one on hardware.
param-mldsa44 = []
verify-only = []

[dependencies]
ml-dsa = { workspace = true }

[lints]
workspace = true
