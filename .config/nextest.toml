# Note on why multiple profiles are used to enable JUnit support: this is done
# as a workaround to prevent each nextest run from overwriting the same output
# file (saved to target/nextest/<profile>/<path>) during the rust.yml workflow.

# profile for running all mock tests
# `vsocksrv_integration` spawns the separately-built `vsocksrv` binary
# (see `tools/vsocksrv/README.md`), which this profile's `--workspace`
# invocation does not build; it is only exercised by the dedicated
# `ci-sock-ddi` profile, which builds `vsocksrv` first.
[profile.ci-mock]
default-filter = "not binary_id(azihsm_ddi_sock::vsocksrv_integration)"

# Resiliency stress tests are timing-sensitive; reserve the whole runner so
# they do not run in parallel with any other test or each other.
[[profile.ci-mock.overrides]]
filter = "test(resiliency::stress::) or test(_resiliency_stress::)"
# threads-required = "num-cpus"

[profile.ci-mock.junit]
path = "junit.xml"

# profile for running resiliency fault-injection tests
[profile.ci-mock-res.junit]
path = "junit.xml"

# profile for running all mock tests w/ table-4
[profile.ci-mock-table-4.junit]
path = "junit.xml"

# profile for running all mock tests w/ table-64
[profile.ci-mock-table-64.junit]
path = "junit.xml"

# profile for running the TBOR types tests against the emu backend
# (in-process firmware).
[profile.ci-tbor-emu.junit]
path = "junit.xml"

# profile for running integration tests
# test-threads = 1: serial_test uses a per-process mutex; nextest runs each test
# in its own process, so explicit serialization is required to avoid file collisions.
[profile.ci-provider-integration]
test-threads = 1

[profile.ci-provider-integration.junit]
path = "junit.xml"

[profile.ci-api.junit]
path = "junit.xml"

# profile for running emu smoke tests
# (in-process firmware).
[profile.ci-emu-smoke.junit]
path = "junit.xml"

# profile for running emu ddi tests
[profile.ci-emu-ddi.junit]
path = "junit.xml"

# profile for running socket DDI tests against a live vsocksrv process
[profile.ci-sock-ddi.junit]
path = "junit.xml"

# profile for running azihsm_api_tests's vsocksrv session regression test
# against a live vsocksrv process
[profile.ci-api-sock.junit]
path = "junit.xml"
