[package]
edition = "2024"
name = "azihsm_sdk_fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
azihsm_crypto = { path = "../crates/crypto" }
azihsm_ddi = { path = "../ddi/lib" }
azihsm_ddi_emu = { path = "../ddi/emu" }
azihsm_ddi_interface = { path = "../ddi/interface" }
azihsm_ddi_mbor_codec = { path = "../ddi/mbor/codec" }
azihsm_ddi_mbor_test_helpers = { path = "../ddi/mbor/test_helpers" }
azihsm_ddi_mbor_types = { path = "../ddi/mbor/types" }
azihsm_ddi_tbor_codec = { path = "../ddi/tbor/codec" }
azihsm_ddi_tbor_types = { path = "../ddi/tbor/types" }
azihsm_session_ex_crypto = { path = "../crates/session_ex_crypto" }
x509 = { path = "../crates/x509" }

# dependencies for fuzzing
libfuzzer-sys = { features = ["arbitrary-derive"], version = "0.4" }

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_request_encoder"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_request_encoder.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_request_round_trip"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_request_round_trip.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_request_view"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_request_view.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_response_encoder"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_response_encoder.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_response_round_trip"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_response_round_trip.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_response_view"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_response_view.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_session_open_init"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_session_open_init.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_tbor_session_open_round_trip"
path = "fuzz_targets/ddi/tbor/fuzz_tbor_session_open_round_trip.rs"
test = false
