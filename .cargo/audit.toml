# Ignore unmaintained transitive dependencies of `lit` (test-only crate).
# `lit` depends on `clap 2.x` which pulls in these crates.
# None of these are actual security vulnerabilities — they are "unmaintained"
# warnings only. They are never used in library or production code, only during
# `cargo test` via the `integration-tests` crate.
[advisories]
ignore = [
  "RUSTSEC-2018-0015", # term - unmaintained (via lit)
  "RUSTSEC-2021-0139", # ansi_term - unmaintained (via clap 2.x)
  "RUSTSEC-2021-0145", # atty - potential unaligned read (via clap 2.x)
  "RUSTSEC-2024-0375", # atty - unmaintained (via clap 2.x)
]
