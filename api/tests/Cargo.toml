[package]
edition = "2024"
name = "azihsm_api_tests"
version = "0.0.0"

[dependencies]
azihsm_ddi_mock = { optional = true, workspace = true }

[build-dependencies]
cmake.workspace = true

[dev-dependencies]
azihsm_api.workspace = true
azihsm_api_tests_macro.workspace = true
azihsm_crypto = { features = ["testvectors"], workspace = true }
azihsm_resiliency_test_helpers.workspace = true
hex.workspace = true
libtest-mimic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true

[features]
default = []
mock = ["azihsm_api/mock"]
# Fault-injection requires the mock DDI since the FaultRule hooks live there;
# enabling res-fi without mock would compile the fault API but never observe
# the injected rules at runtime.
res-fi = ["mock", "azihsm_api/res-fi", "azihsm_ddi_mock/res-fi", "dep:azihsm_ddi_mock"]

[lints]
workspace = true

[[test]]
harness = false
name = "cpp"
path = "cpp/tests.rs"
