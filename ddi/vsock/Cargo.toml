[package]
edition = "2021"
name = "azihsm_ddi_vsock"
version = "0.1.0"

[lib]
doctest = false

[dependencies]
azihsm_ddi_interface.workspace = true
azihsm_ddi_mbor_codec.workspace = true
azihsm_ddi_mbor_types.workspace = true
azihsm_ddi_sock_proto.workspace = true
azihsm_ddi_tbor_codec.workspace = true
azihsm_ddi_tbor_types.workspace = true
azihsm_fw_hsm_io.workspace = true
libc.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true

[dev-dependencies]
azihsm_cred_encrypt.workspace = true
azihsm_crypto.workspace = true
# Forced "vsock" so `azihsm_ddi_mbor_test_helpers`'s generic
# `<AzihsmDdi as Ddi>::Dev` helpers (used by this crate's real-session
# regression test) resolve to this crate's own `DdiVsockDev`, not another
# backend. This is a dev-dependency-only cycle back onto this crate
# (through the `azihsm_ddi` facade's optional `azihsm_ddi_vsock` dep),
# which Cargo supports for test-only code.
azihsm_ddi = { features = ["vsock"], workspace = true }
azihsm_ddi_mbor_test_helpers.workspace = true
x509.workspace = true

[lints]
workspace = true
