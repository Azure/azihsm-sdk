name: Ubuntu Setup
description: Install apt packages, restore Cargo cache, and run setup on cache miss
outputs:
  cache-hit:
    description: Whether the Cargo cache was restored
    value: ${{ steps.cargo-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Install arm64 build dependencies
      if: ${{ runner.arch == 'ARM64' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev
    # Arm64 images ship no rustup.  Install it with no default
    # toolchain so rust-toolchain.toml stays the single source of the
    # toolchain version (rustup auto-installs it on the first cargo call).
    - name: Install rustup
      if: ${{ runner.arch == 'ARM64' }}
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain none --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install apt packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libbsd-dev
    - name: Restore Cargo cache
      id: cargo-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.CACHE_KEY_ID }}
    - name: Setup on cache miss
      if: steps.cargo-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo xtask precheck --setup
