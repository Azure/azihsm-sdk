name: Create New Cache

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/create_new_cache.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  create_new_cache_ubuntu:

    name: create_new_cache_ubuntu (${{ matrix.runner }})

    strategy:
      matrix:
        runner: [ubuntu-24.04, azihsm-x64-gh-ubuntu2404-pool, azihsm-arm64-gh-ubuntu2404-pool]

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install arm64 build dependencies
      if: ${{ runner.arch == 'ARM64' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev
    - name: Install rustup
      if: ${{ runner.arch == 'ARM64' }}
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain none --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Run Setup
      run: cargo xtask precheck --setup
    - name: Save Cargo cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.sha }}

  create_new_cache_windows:

    name: create_new_cache_windows (${{ matrix.runner }})

    strategy:
      matrix:
        runner: [windows-2025-vs2026, azihsm-x64-gh-winserver22-pool]

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run Setup
      run: cargo xtask precheck --setup
    - name: Save Cargo cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ github.sha }}
