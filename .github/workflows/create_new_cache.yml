name: Create New Cache

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/create_new_cache.yml
  pull_request:
    branches: [ main, dev, fw-main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  create_new_cache_ubuntu:

    runs-on: [azihsm-x64-gh-ubuntu2404-pool]

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v6
    - name: Run Setup
      run: cargo xtask precheck --setup
    - name: Save Cargo cache
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ github.sha }}

  create_new_cache_windows:

    runs-on: [azihsm-x64-gh-winserver22-pool]

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v6
    - name: Run Setup
      run: cargo xtask precheck --setup
    - name: Save Cargo cache
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ github.sha }}
