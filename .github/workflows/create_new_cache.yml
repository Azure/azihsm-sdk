name: Create New Cache

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/create_new_cache.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  create_new_cache_ubuntu:

    name: create_new_cache_ubuntu (${{ matrix.image }})

    strategy:
      fail-fast: false
      matrix:
        image: [dummy-arm64-image, dummy-x64-image] # TODO: Update these to real images once they're available

    runs-on:
    - self-hosted
    - 1ES.Pool=dummy-pool # TODO: Update this to a real pool once it's available
    - 1ES.ImageOverride=${{ matrix.image }}
    - JobId=create_new_cache_ubuntu-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v6
    - name: Run Setup
      run: cargo xtask precheck --setup
    - name: Save Cargo cache
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ github.sha }}

  create_new_cache_windows:

    runs-on: windows-2025-vs2026

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v6
    - name: Run Setup
      run: cargo xtask precheck --setup
    - name: Save Cargo cache
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ github.sha }}
