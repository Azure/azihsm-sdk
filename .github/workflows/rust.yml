      run: cargo xtask precheck --coverage -E 'binary_id(azihsm_fw_hsm*)' --features mock --profile ci-mock
      continue-on-error: true
    - name: azihsm_tpm
      id: azihsm_tpm
      run: cargo xtask precheck --coverage -E 'binary_id(azihsm_tpm)' --features mock --profile ci-mock
      continue-on-error: true
    # END TEMP BREAKOUT
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-ubuntu
        path: ./target/reports/
    - name: Generate nextest report
      id: nextest-report
      run: cargo xtask precheck --nextest-report
