    # - name: Run all mock tests with code coverage
    #   id: test-mock-coverage
    #   run: cargo xtask precheck --coverage --features mock --profile ci-mock
    #   continue-on-error: true

    # TEMPORARIY BREAK OUT BY BINARY ID TO ASSESS RUNTIMES - REMOVE ONCE FIXED
