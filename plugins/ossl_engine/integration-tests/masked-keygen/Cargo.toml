[package]
edition = "2024"
name = "azihsm-engine-masked-keygen"
publish = false
version = "0.1.0"

[[bin]]
name = "masked-keygen"
path = "src/main.rs"

# Gated so a plain `cargo build --workspace` (e.g. the OpenSSL 3.x rust.yml
# cells) doesn't pull the OpenSSL 1.1.x engine; the integration harness builds
# this with `--features integration`.
[features]
integration = ["dep:azihsm_ossl_engine"]

[dependencies]
azihsm_ossl_engine = { features = [
  "engine",
  "integration",
  "mock",
], optional = true, path = "../../azihsm_ossl_engine" }
zeroize.workspace = true

[lints]
workspace = true
