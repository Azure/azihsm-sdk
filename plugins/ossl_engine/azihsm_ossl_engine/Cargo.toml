[package]
edition = "2024"
name = "azihsm_ossl_engine"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
engine = ["azihsm_ossl_engine_core/engine"]
mock = ["azihsm_api/mock"]

[dependencies]
azihsm_api.workspace = true
azihsm_ossl_engine_core.workspace = true
azihsm_ossl_engine_resiliency.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { features = ["env-filter"], workspace = true }
zeroize.workspace = true

# libc backs the O_NOFOLLOW hardening on the Linux-only file opens.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# openssl (→ openssl-sys) can't build on Windows and the engine is Linux-only,
# so gate it — mirrors azihsm_ossl_engine_resiliency. Used to reconstruct a
# public EVP_PKEY from the SDK's DER in the key loader.
[target.'cfg(target_os = "linux")'.dependencies]
foreign-types.workspace = true
openssl.workspace = true

# serial_test is only used by the Linux-only mock tests; keep it gated so the
# Windows `--all-targets` build stays clean.
[target.'cfg(target_os = "linux")'.dev-dependencies]
serial_test.workspace = true

[lints]
workspace = true
